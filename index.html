<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - سلة التسوق وإتمام الطلب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; }
        h2 { text-align: center; margin-bottom: 15px; color: #1a252f; }
        
        /* ملخص السلة */
        .cart-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .cart-item h3 { font-size: 16px; color: #2c3e50; margin-bottom: 8px; }
        .cart-detail { font-size: 14px; color: #666; margin: 4px 0; }
        
        /* نموذج الشحن */
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        /* زر إرسال الطلب */
        .submit-btn {
            background-color: #25d366; /* لون الواتساب */
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 سلة التسوق وإتمام الطلب</h2>

    <!-- ملخص المنتجات -->
    <div class="cart-item">
        <h3>منتجك المُصمم</h3>
        <p class="cart-detail"><strong>النوع:</strong> تيشيرت مخصص</p>
        <p class="cart-detail"><strong>اللون:</strong> أبيض</p>
        <p class="cart-detail"><strong>النص المكتوب:</strong> فطومه الحلوه</p>
        <p class="cart-detail"><strong>السعر:</strong> 15$</p>
    </div>

    <!-- معلومات العميل -->
    <form id="orderForm">
        <div class="form-group">
            <label for="fullName">الاسم الكامل:</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" placeholder="07XXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="address">العنوان الكامل (المدينة / الحي):</label>
            <textarea id="address" rows="3" placeholder="أدخل تفاصيل العنوان والتوصيل" required></textarea>
        </div>

        <button type="button" class="submit-btn" onclick="sendToWhatsApp()">
            تأكيد وإرسال الطلب عبر الواتساب 💬
        </button>
    </form>
</div>

<script>
    function sendToWhatsApp() {
        const name = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;

        if (!name || !phone || !address) {
            alert('يرجى ملاء جميع الحقول المطلوبة!');
            return;
        }

        // رقم واتساب المتجر (ضع رقمك هنا بدلاً من الرقم الافتراضي)
        const merchantPhone = "9647000000000"; 

        // نص الرسالة المُنسق
        const message = `مرحباً SharikiHub! أرغب بتأكيد الطلب التالي:%0A%0A` +
                        `👤 *اسم العميل:* ${name}%0A` +
                        `📞 *رقم الهاتف:* ${phone}%0A` +
                        `📍 *العنوان:* ${address}%0A%0A` +
                        `📦 *تفاصيل المنتج:*%0A` +
                        `- تيشيرت مخصص%0A` +
                        `- النص: فطومه الحلوه%0A` +
                        `- السعر الإجمالي: 15$`;

        // فتح الواتساب مباشر
        window.open(`https://wa.me/${merchantPhone}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
