<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - المنصة الشاملة</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 75px;
        }

        /* الهيدر العلوي */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .search-icon {
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* حاوية الأقسام */
        .container {
            padding: 15px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* الصفحات المتحركة */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 20px 0 12px 0;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* شبكة الكروت (Grid) بنفس أبعاد وتصميم البارحة */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .card h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* كارت مركز المحادثات الكامل */
        .full-card {
            grid-column: span 2;
            padding: 20px;
            border-color: var(--primary-color);
            background: #ffffff;
        }

        /* واجهة المحادثات والدردشة الداخلي */
        .chat-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #eff6ff;
        }

        .chat-messages {
            height: 320px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.received {
            background-color: #f1f5f9;
            align-self: flex-start;
        }

        .message.sent {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            background: var(--card-bg);
        }

        .chat-input button {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شريط التنقل السفلي الأصلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 0.75rem;
            text-align: center;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        .nav-item .icon {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 2px;
        }

        /* النافذة المنبثقة للتنبيه */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: white;
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }

        .modal-content button {
            margin-top: 15px;
            padding: 9px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>SharikiHub</h1>
        <div class="search-icon">🔍</div>
    </header>

    <div class="container">
        
        <!-- صفحة الرئيسية الأصلية بالكامل -->
        <div id="page-home" class="page active">
            
            <!-- خدمات الطباعة حسب الطلب -->
            <div class="section-title">🖨️ خدمات الطباعة حسب الطلب</div>
            <div class="grid">
                <div class="card">
                    <span class="icon">👕</span>
                    <h3>الأزياء والملابس</h3>
                </div>
                <div class="card">
                    <span class="icon">🎨</span>
                    <h3>متجر التصاميم</h3>
                </div>
            </div>

            <!-- الأقسام الترفيهية -->
            <div class="section-title">🎉 الأقسام الترفيهية</div>
            <div class="grid">
                <div class="card">
                    <span class="icon">⚽</span>
                    <h3>الرياضة</h3>
                </div>
                <div class="card">
                    <span class="icon">📚</span>
                    <h3>الكتب والقراءة</h3>
                </div>
                <div class="card">
                    <span class="icon">🎬</span>
                    <h3>الأفلام والسينما</h3>
                </div>
                <div class="card">
                    <span class="icon">👗</span>
                    <h3>عالم الموضة</h3>
                </div>
            </div>

            <!-- التواصل والمحادثات -->
            <div class="section-title">💬 التواصل والمحادثات</div>
            <div class="grid">
                <div class="card full-card" onclick="switchTab('chat')">
                    <span class="icon">💬</span>
                    <h3>مركز المحادثات والدعم</h3>
                </div>
            </div>

        </div>

        <!-- صفحة المحادثات الشاملة (تفتح بسلاسة من الشريط أو الكارت) -->
        <div id="page-chat" class="page">
            <div class="section-title">💬 مركز المحادثات</div>
            
            <div class="chat-tabs">
                <button class="tab-btn active" id="btn-support" onclick="switchSection('support')">🛠️ الدعم الفني</button>
                <button class="tab-btn" id="btn-communities" onclick="switchSection('communities')">🌐 المجتمعات</button>
                <button class="tab-btn" id="btn-messages" onclick="switchSection('messages')">💬 المحادثات الشخصية</button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- يتم جلب الرسائل من Firebase هنا -->
            </div>

            <div class="chat-input">
                <input type="text" id="user-input" placeholder="اكتب رسالتك هنا...">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي الأصلي للتنقل السلس -->
    <div class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <span class="icon">🏠</span>
            الرئيسية
        </button>
        <button class="nav-item">
            <span class="icon">🛍️</span>
            المتجر
        </button>
        <button class="nav-item" id="nav-chat" onclick="switchTab('chat')">
            <span class="icon">💬</span>
            المحادثات
        </button>
        <button class="nav-item">
            <span class="icon">👤</span>
            حسابي
        </button>
    </div>

    <!-- النافذة المنبثقة لطلب تسجيل الدخول -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3>تنبيه</h3>
            <p>يرجى تسجيل الدخول للوصول إلى هذا القسم واستخدامه.</p>
            <button onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <!-- ربط Firebase المفعل بالكامل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwn1cYeo-jP-ccBMZRRMrEZ2R_RdSvw50",
            authDomain: "sharikihub.firebaseapp.com",
            databaseURL: "https://sharikihub-default-rtdb.firebaseio.com",
            projectId: "sharikihub",
            storageBucket: "sharikihub.firebasestorage.app",
            messagingSenderId: "393020794820",
            appId: "1:393020794820:web:1a6a55be713028fb9e2691",
            measurementId: "G-QL47SXGDPR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.isLoggedIn = false;
        window.currentSection = 'support';
        let unsubscribe = null;

        // التنقل بين الصفحات السفلية
        window.switchTab = function(tabName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (tabName === 'home') {
                document.getElementById('page-home').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
            } else if (tabName === 'chat') {
                document.getElementById('page-chat').classList.add('active');
                document.getElementById('nav-chat').classList.add('active');
                listenForMessages();
            }
        };

        // التنقل بين أقسام المحادثة
        window.switchSection = function(section) {
            if ((section === 'communities' || section === 'messages') && !window.isLoggedIn) {
                document.getElementById('auth-modal').style.display = 'flex';
                return;
            }

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            window.currentSection = section;
            
            if (section === 'support') document.getElementById('btn-support').classList.add('active');
            if (section === 'communities') document.getElementById('btn-communities').classList.add('active');
            if (section === 'messages') document.getElementById('btn-messages').classList.add('active');

            listenForMessages();
        };

        function listenForMessages() {
            if (unsubscribe) unsubscribe();

            const messagesRef = collection(db, "chats", window.currentSection, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const messagesContainer = document.getElementById('chat-messages');
                messagesContainer.innerHTML = '';

                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const msgDiv = document.createElement('div');
                    
                    msgDiv.className = msgData.sender === "user" ? "message sent" : "message received";
                    msgDiv.innerText = msgData.text;
                    
                    messagesContainer.appendChild(msgDiv);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        window.sendMessage = async function() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            try {
                const messagesRef = collection(db, "chats", window.currentSection, "messages");
                await addDoc(messagesRef, {
                    text: text,
                    sender: "user",
                    timestamp: serverTimestamp()
                });
                input.value = '';
            } catch (error) {
                console.error("خطأ أثناء إرسال الرسالة:", error);
            }
        };

        window.closeModal = function() {
            document.getElementById('auth-modal').style.display = 'none';
        };
    </script>
</body>
</html>
