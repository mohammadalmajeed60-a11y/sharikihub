<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - استوديو التصميم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #1a252f;
        }
        /* منطقة معاينة المنتج */
        .preview-area {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #e9ecef;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px dashed #ccc;
        }
        .product-mockup {
            width: 240px;
            height: 280px;
            background-color: #ffffff; /* لون المنتج الأولي */
            border-radius: 10px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* الطباعة على المنتج */
        .design-element {
            position: absolute;
            max-width: 140px;
            max-height: 140px;
            text-align: center;
            word-wrap: break-word;
            cursor: move;
            user-select: none;
        }
        .design-element img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* أدوات التحكم */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 استوديو تصميم SharikiHub</h2>
    
    <!-- شاشة المعاينة -->
    <div class="preview-area">
        <div class="product-mockup" id="productMockup">
            <!-- عنصر النص المُضاف -->
            <div class="design-element" id="textPreview">نصك هنا</div>
            <!-- عنصر الصورة المُضافة -->
            <div class="design-element" id="imagePreviewContainer" style="display:none;">
                <img id="imagePreview" src="" alt="شعارك">
            </div>
        </div>
    </div>

    <!-- لوحة التحكم بالهاتف -->
    <div class="controls">
        <div class="control-group">
            <label for="productColor">اختر لون المنتج:</label>
            <input type="color" id="productColor" value="#ffffff">
        </div>

        <div class="control-group">
            <label for="userText">إضافة نص على المنتج:</label>
            <input type="text" id="userText" placeholder="اكتب النص هنا...">
        </div>

        <div class="control-group">
            <label for="textColor">لون النص:</label>
            <input type="color" id="textColor" value="#000000">
        </div>

        <div class="control-group">
            <label for="imageUpload">رفع تصميم / شعار (PNG/JPG):</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <button onclick="saveDesign()">حفظ المعاينة والارسال للسلة 🛒</button>
    </div>
</div>

<script>
    // تغيير لون المنتج
    document.getElementById('productColor').addEventListener('input', function(e) {
        document.getElementById('productMockup').style.backgroundColor = e.target.value;
    });

    // تحديث النص اللحظي
    document.getElementById('userText').addEventListener('input', function(e) {
        document.getElementById('textPreview').innerText = e.target.value || 'نصك هنا';
    });

    // تغيير لون النص
    document.getElementById('textColor').addEventListener('input', function(e) {
        document.getElementById('textPreview').style.color = e.target.value;
    });

    // رفع وعرض الصورة
    document.getElementById('imageUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgContainer = document.getElementById('imagePreviewContainer');
                document.getElementById('imagePreview').src = event.target.result;
                imgContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    function saveDesign() {
        alert('تم حفظ تصميمك بنجاح! جاهز للانتقال لنظام الطلبات.');
    }
</script>

</body>
</html>
