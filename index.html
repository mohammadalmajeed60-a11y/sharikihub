<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SharikiHub - المنصة الشاملة</title>
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #1a2232;
      --border: #2a364f;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --purple-accent: #8b5cf6;
      --gold-gradient: linear-gradient(135deg, #ffd700, #b8860b);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    html, body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* الهيدر العلوي المثبت */
    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }

    .gold-key-btn {
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* حاوية السحب والأقسام الرئيسية أفلاقياً */
    .swipe-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 120px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .swipe-container::-webkit-scrollbar { display: none; }

    .page-section {
      min-width: 100%;
      max-width: 100%;
      height: 100%;
      scroll-snap-align: start;
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 20px;
    }

    /* كروت واستعراض الصفحة الرئيسية */
    .hero-card {
      background: linear-gradient(135deg, #1e1b4b, #311b92);
      border: 1px solid var(--purple-accent);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    .hero-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
    .hero-desc { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 15px; }

    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
    }

    .menu-icon { font-size: 1.8rem; }
    .menu-title { font-size: 0.85rem; font-weight: bold; }

    /* الشريط السفلي المثبت */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-item.active {
      color: var(--purple-accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header>
    <div class="brand-title">🌐 SharikiHub</div>
    <button class="gold-key-btn" onclick="alert('🔑 بوابة المفتاح الذهبي نشطة!')">🔑 المفتاح الذهبي</button>
  </header>

  <!-- حاوية التنقل بالسحب يميناً وشمالاً -->
  <div class="swipe-container" id="swipeContainer">
    
    <!-- قسم 1: الصفحة الرئيسية والسوق -->
    <section class="page-section" id="sec-home">
      <div class="hero-card">
        <div class="hero-title">مرحباً بك في SharikiHub 👋</div>
        <div class="hero-desc">منصتك الجامعة للتواصل، الترفيه، والتصميم حسب الطلب.</div>
      </div>

      <div class="grid-menu">
        <div class="menu-card" onclick="scrollToSection(1)">
          <div class="menu-icon">🎨</div>
          <div class="menu-title">استوديو الطباعة</div>
        </div>
        <div class="menu-card" onclick="scrollToSection(2)">
          <div class="menu-icon">💬</div>
          <div class="menu-title">المحادثات والمجتمعات</div>
        </div>
        <div class="menu-card" onclick="scrollToSection(3)">
          <div class="menu-icon">🎬</div>
          <div class="menu-title">قسم الريلز</div>
        </div>
        <div class="menu-card" onclick="alert('قسم الألعاب والمسابقات قيد التطوير!')">
          <div class="menu-icon">🏆</div>
          <div class="menu-title">الرياضة والترفيه</div>
        </div>
      </div>
    </section>

    <!-- قسم 2: استوديو التصميم والطباعة -->
    <section class="page-section" id="sec-studio">
      <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: #38bdf8;">🎨 استوديو التصميم والطباعة</h2>
      <iframe src="studio.html" style="width: 100%; height: 90%; border: none; border-radius: 12px;"></iframe>
    </section>

    <!-- قسم 3: مركز المحادثات والمجتمعات -->
    <section class="page-section" id="sec-chat">
      <iframe src="chat.html" style="width: 100%; height: 95%; border: none; border-radius: 12px;"></iframe>
    </section>

    <!-- قسم 4: الريلز والترفيه -->
    <section class="page-section" id="sec-reels">
      <iframe src="reels.html" style="width: 100%; height: 95%; border: none; border-radius: 12px;"></iframe>
    </section>

  </div>

  <!-- الشريط السفلي المثبت للتحكم والتنقل -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="scrollToSection(0)">🏠 الرئيسية</button>
    <button class="nav-item" onclick="scrollToSection(1)">🎨 الاستوديو</button>
    <button class="nav-item" onclick="scrollToSection(2)">💬 المحادثات</button>
    <button class="nav-item" onclick="scrollToSection(3)">🎬 ريلز</button>
  </nav>

  <script>
    const container = document.getElementById('swipeContainer');
    const navItems = document.querySelectorAll('.nav-item');

    function scrollToSection(index) {
      const width = container.clientWidth;
      container.scrollTo({
        left: width * index,
        behavior: 'smooth'
      });
      updateNav(index);
    }

    function updateNav(index) {
      navItems.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }

    // مزامنة حالة الأزرار مع السحب باليد (Swipe)
    container.addEventListener('scroll', () => {
      const index = Math.round(container.scrollLeft / container.clientWidth);
      updateNav(index);
    });
  </script>
</body>
</html>
