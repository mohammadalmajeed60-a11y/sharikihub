<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - الرئيسية</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .post-content {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .post-preview {
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 12px;
            border: 1px dashed var(--border-color);
        }

        .post-footer {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .action-btn, .print-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .print-btn {
            margin-right: auto;
            color: #ec4899;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>SharikiHub</h1>
    </header>

    <div class="container">
        <!-- منشور تجريبي -->
        <div class="post-card">
            <div class="post-header">
                <div class="avatar">أ</div>
                <div class="user-info">
                    أحمد علي
                    <span>منذ 10 دقائق • مجلس التصميم</span>
                </div>
            </div>
            
            <div class="post-content">
                تصميم مستوحى من أدب الجريمة والكتب المترجمة، ما رأيكم به؟
            </div>
            
            <div class="post-preview">
                📷 [معاينة صورة التصميم أو فيديو الريلز]
            </div>
            
            <div class="post-footer">
                <button class="action-btn">❤️ 24</button>
                <button class="action-btn">💬 8 تعليقات</button>
                <a href="design-studio.html" class="print-btn">🛍️ طباعة</a>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي المحدث بالروابط الصحيحة -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">🏠 الرئيسية</a>
        <a href="reels.html" class="nav-item">🎬 ريلز</a>
        <a href="chat.html" class="nav-item">💬 المحادثات</a>
        <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
        <a href="admin.html" class="nav-item">👤 الملف</a>
    </nav>

</body>
</html>
