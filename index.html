<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SharikiHub - المنصة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding-bottom: 90px; }
        
        .hero {
            background: linear-gradient(135deg, #6c5ce7 0%, #ff7675 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
        }
        .hero h1 { font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .hero p { font-size: 15px; opacity: 0.95; font-weight: 700; }

        .section-title { margin: 25px 20px 15px; font-size: 18px; font-weight: 900; color: #a29bfe; display: flex; align-items: center; gap: 8px; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 0 20px; }
        
        .card {
            background: #181b2a;
            border: 1px solid #2d3250;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card:active { transform: scale(0.98); }
        .card-studio { border-right: 6px solid #fd79a8; }
        .card-games { border-right: 6px solid #00b894; }
        .card-admin { border-right: 6px solid #0984e3; }

        .card-info h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .card-info p { font-size: 12px; color: #b2bec3; }
        .card-icon { font-size: 32px; }

        .nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #181b2a;
            border-top: 1px solid #2d3250;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item { text-decoration: none; color: #b2bec3; font-size: 12px; font-weight: 700; text-align: center; display: flex; flex-direction: column; gap: 4px; }
        .nav-item.active { color: #ff7675; }
    </style>
</head>
<body>

<div class="hero">
    <h1>SharikiHub</h1>
    <p>صمم، استمتع، وشارك ابداعك بلا حدود 🔥</p>
</div>

<div class="section-title">🚀 أقسام المنصة الرئيسية</div>

<div class="grid">
    <a href="design-studio.html" class="card card-studio">
        <div class="card-info">
            <h3>🎨 استوديو التصميم</h3>
            <p>خصص منتجاتك وطباعتك حسب الطلب فوراً</p>
        </div>
        <div class="card-icon">✨</div>
    </a>

    <a href="entertainment.html" class="card card-games">
        <div class="card-info">
            <h3>🎮 ركن الترفيه</h3>
            <p>العاب، مسابقات ومحتوى تفاعلي مميز</p>
        </div>
        <div class="card-icon">🎲</div>
    </a>

    <a href="admin.html" class="card card-admin">
        <div class="card-info">
            <h3>⚙️ لوحة الإدارة</h3>
            <p>متابعة الطلبات وإدارة محتوى المنصة</p>
        </div>
        <div class="card-icon">📊</div>
    </a>
</div>

<nav class="nav">
    <a href="index.html" class="nav-item active"><span>🏠</span>الرئيسية</a>
    <a href="design-studio.html" class="nav-item"><span>🎨</span>الاستوديو</a>
    <a href="entertainment.html" class="nav-item"><span>🎮</span>الترفيه</a>
</nav>

</body>
</html>
