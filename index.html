<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* الهيدر */
        .header { text-align: center; margin-bottom: 20px; background: #1a252f; color: white; padding: 15px; border-radius: 12px; }
        .header h1 { font-size: 20px; }
        
        /* كروت الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-number { font-size: 22px; font-weight: bold; color: #27ae60; margin-top: 5px; }

        /* الأقسام */
        .section-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 16px; color: #1a252f; margin-bottom: 12px; border-bottom: 2px solid #f4f6f9; padding-bottom: 8px; }

        /* جدول الطلبات */
        .order-item { background: #f8f9fa; border-right: 4px solid #e67e22; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 13px; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        
        /* نموذج إضافة منتج */
        .form-group { margin-bottom: 10px; }
        label { font-size: 12px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-top: 4px; }
        
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚙️ لوحة إدارة SharikiHub</h1>
    </div>

    <!-- ملخص الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div>إجمالي الطلبات</div>
            <div class="stat-number" id="totalOrders">12</div>
        </div>
        <div class="stat-card">
            <div>الأرباح التقديرية</div>
            <div class="stat-number">$180</div>
        </div>
    </div>

    <!-- إدارة الطلبات الواردة -->
    <div class="section-card">
        <h3 class="section-title">📦 أحدث الطلبات</h3>
        <div id="ordersList">
            <div class="order-item">
                <div class="order-header">
                    <span>طلب #101 - محمد</span>
                    <span style="color: #e67e22;">قيد التنفيذ</span>
                </div>
                <div>المنتج: تيشيرت مخصص (فطومه الحلوه)</div>
                <div>المبلغ: 15$ | الهاتف: 07800000000</div>
            </div>
        </div>
    </div>

    <!-- إضافة منتج جديد -->
    <div class="section-card">
        <h3 class="section-title">➕ إضافة منتج جديد للمتجر</h3>
        <form id="addProductForm" onsubmit="addNewProduct(event)">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prodName" placeholder="مثال: كوب رياضي" required>
            </div>
            <div class="form-group">
                <label>السعر ($):</label>
                <input type="number" id="prodPrice" placeholder="10" required>
            </div>
            <div class="form-group">
                <label>القسم:</label>
                <select id="prodCat">
                    <option value="طباعة">طباعة حسب الطلب</option>
                    <option value="كتب">الكتب</option>
                    <option value="رياضة">الرياضة</option>
                    <option value="أزياء">الأزياء</option>
                </select>
            </div>
            <button type="submit" class="btn-add">إضافة المنتج للمتجر 🚀</button>
        </form>
    </div>
</div>

<script>
    function addNewProduct(e) {
        e.preventDefault();
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;
        alert(`تمت إضافة المنتج "${name}" بسعر $${price} بنجاح إلى المتجر!`);
        document.getElementById('addProductForm').reset();
    }
</script>

</body>
</html>
