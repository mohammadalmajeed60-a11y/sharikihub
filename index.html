<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتك المتكاملة</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2e2e3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }

        /* شريط التنقل السفلي المحدث مع قسم الريلز */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background-color: var(--card-bg);
            display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted); text-decoration: none;
            font-size: 0.75rem; display: flex; flex-direction: column;
            align-items: center; gap: 4px;
        }

        .nav-item.active { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">منصتنا</div>
        <div>🔍</div>
    </header>

    <div class="container">
        <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">
            🎬 قسم الريلز والمنشورات التفاعلية قيد التطوير...
        </div>
    </div>

    <!-- شريط التنقل السفلي يشمل الريلز الآن -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">🏠 الرئيسية</a>
        <a href="#" class="nav-item">🎬 ريلز</a>
        <a href="#" class="nav-item">💬 المحادثات</a>
        <a href="#" class="nav-item">🛍️ المتجر</a>
        <a href="#" class="nav-item">👤 الملف</a>
    </nav>

</body>
</html>
