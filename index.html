<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - المحادثات المباشرة</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --primary-color: #2563eb;
            --sidebar-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .nav-button {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-button:hover {
            background-color: #f1f5f9;
        }

        .nav-button.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* منطقة المحتوى والدردشة */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.received {
            background-color: #f1f5f9;
            align-self: flex-start;
        }

        .message.sent {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        .chat-input button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* نافذة تنبيه تسجيل الدخول Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .modal-content button {
            margin-top: 15px;
            padding: 8px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h2>SharikiHub Chat</h2>
        
        <button class="nav-button" onclick="switchSection('communities')">
            🌐 المجتمعات
        </button>
        
        <button class="nav-button" onclick="switchSection('messages')">
            💬 المحادثات الشخصية
        </button>
        
        <button class="nav-button active" id="btn-support" onclick="switchSection('support')">
            🛠️ الدعم الفني
        </button>
    </div>

    <!-- واجهة المحادثة الرئيسية -->
    <div class="main-chat">
        <div class="chat-header" id="chat-title">
            قسم الدعم الفني
        </div>
        
        <div class="chat-body" id="chat-messages">
            <!-- الرسائل تُجلب ديناميكياً من Firebase -->
        </div>

        <div class="chat-input">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <!-- نافذة التنبيه عند عدم تسجيل الدخول -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3>تنبيه</h3>
            <p>يرجى تسجيل الدخول للوصول إلى هذا القسم واستخدامه.</p>
            <button onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <!-- استدعاء Firebase وحقن الإعدادات الخاصة بمشروعك -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بمشروع SharikiHub
        const firebaseConfig = {
            apiKey: "AIzaSyBwn1cYeo-jP-ccBMZRRMrEZ2R_RdSvw50",
            authDomain: "sharikihub.firebaseapp.com",
            databaseURL: "https://sharikihub-default-rtdb.firebaseio.com",
            projectId: "sharikihub",
            storageBucket: "sharikihub.firebasestorage.app",
            messagingSenderId: "393020794820",
            appId: "1:393020794820:web:1a6a55be713028fb9e2691",
            measurementId: "G-QL47SXGDPR"
        };

        // تهيئة التطبيق والقواعد
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.isLoggedIn = false;
        window.currentSection = 'support';
        let unsubscribe = null;

        window.switchSection = function(section) {
            if ((section === 'communities' || section === 'messages') && !window.isLoggedIn) {
                document.getElementById('auth-modal').style.display = 'flex';
                return;
            }

            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            window.currentSection = section;
            
            const title = document.getElementById('chat-title');
            if (section === 'support') {
                document.getElementById('btn-support').classList.add('active');
                title.innerText = "قسم الدعم الفني";
            } else if (section === 'communities') {
                title.innerText = "مجتمع الطباعة والتصميم";
            } else if (section === 'messages') {
                title.innerText = "المحادثات الشخصية";
            }

            listenForMessages();
        };

        function listenForMessages() {
            if (unsubscribe) unsubscribe();

            const messagesRef = collection(db, "chats", window.currentSection, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            unsubscribe = onSnapshot(q, (snapshot) => {
                const messagesContainer = document.getElementById('chat-messages');
                messagesContainer.innerHTML = '';

                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const msgDiv = document.createElement('div');
                    
                    msgDiv.className = msgData.sender === "user" ? "message sent" : "message received";
                    msgDiv.innerText = msgData.text;
                    
                    messagesContainer.appendChild(msgDiv);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        window.sendMessage = async function() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            try {
                const messagesRef = collection(db, "chats", window.currentSection, "messages");
                await addDoc(messagesRef, {
                    text: text,
                    sender: "user",
                    timestamp: serverTimestamp()
                });
                input.value = '';
            } catch (error) {
                console.error("خطأ أثناء إرسال الرسالة:", error);
            }
        };

        window.closeModal = function() {
            document.getElementById('auth-modal').style.display = 'none';
        };

        // تشغيل الاستماع لقسم الدعم الفني فور الفتح
        listenForMessages();
    </script>
</body>
</html>
