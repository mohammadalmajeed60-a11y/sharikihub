<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .brand { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .icon-btn { color: var(--text); text-decoration: none; font-size: 1.2rem; }

    .container { padding: 15px; display: flex; flex-direction: column; gap: 15px; }

    .create-post-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .create-post-input {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 15px;
      color: var(--text-muted);
      width: 100%;
      font-size: 0.9rem;
    }

    .quick-access { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .quick-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feed-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
    }

    .feed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); display: flex;
      align-items: center; justify-content: center; font-weight: bold;
    }

    .feed-user { font-weight: bold; font-size: 0.95rem; }
    .feed-content { font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 10px; white-space: pre-line; }
    .feed-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }

    .feed-actions {
      display: flex; gap: 15px; border-top: 1px solid var(--border);
      padding-top: 10px; font-size: 0.85rem; color: var(--text-muted);
    }
    .action-item { cursor: pointer; display: flex; align-items: center; gap: 4px; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      justify-content: center; align-items: center; padding: 20px;
    }

    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; width: 100%; max-width: 450px; padding: 20px;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-textarea {
      width: 100%; height: 90px; background: var(--bg-main);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 10px; resize: none; outline: none; margin-bottom: 10px;
    }

    .file-input-wrapper { margin-bottom: 12px; }
    .file-label {
      display: inline-flex; align-items: center; gap: 6px;
      background: #334155; color: #f8fafc; padding: 8px 12px;
      border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    }
    .image-preview {
      width: 100%; max-height: 150px; object-fit: cover;
      border-radius: 8px; display: none; margin-top: 8px;
    }

    .post-btn {
      width: 100%; padding: 10px; background: var(--accent);
      color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }

    .nav-item {
      color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">SharikiHub</div>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" title="السلة">🛒</a>
      <a href="login.html" class="icon-btn" title="تسجيل الدخول">🔑</a>
    </div>
  </header>

  <div class="container">
    <div class="create-post-box" onclick="openPostModal()">
      <div class="avatar">👤</div>
      <div class="create-post-input">بم تفكر اليوم؟ أضف نصاً أو صورة...</div>
    </div>

    <div class="quick-access">
      <a href="design-studio.html" class="quick-card">🛍️ المتجر والتصاميم</a>
      <a href="reels.html" class="quick-card">🎬 أحدث الريلز</a>
      <a href="explore.html" class="quick-card">🎈 قسم الترفيه</a>
      <a href="chat.html" class="quick-card">💬 مجتمع المنصة</a>
    </div>

    <div id="postsFeed" style="display: flex; flex-direction: column; gap: 15px;"></div>
  </div>

  <div class="modal" id="postModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>إنشاء منشور جديد</h3>
        <span style="cursor:pointer;" onclick="closePostModal()">❌</span>
      </div>
      <textarea id="postText" class="modal-textarea" placeholder="اكتب منشورك هنا..."></textarea>
      
      <div class="file-input-wrapper">
        <label for="postImageInput" class="file-label">🖼️ إرفاق صورة</label>
        <input type="file" id="postImageInput" accept="image/*" style="display:none" onchange="previewImage(event)">
        <img id="imgPreview" class="image-preview" alt="معاينة الصورة">
      </div>

      <button class="post-btn" onclick="publishPost()">نشر الآن 🚀</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    let base64Image = "";

    const defaultPosts = [
      {
        author: "إدارة SharikiHub",
        avatar: "S",
        time: "منذ ساعة",
        content: "مرحباً بكم في المنصة الشاملة! تم إطلاق استوديو التصاميم والمطبوعات بالإضافة للأقسام الترفيهية ومقاطع الريلز. 🔥👕",
        image: ""
      }
    ];

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result;
          const imgElement = document.getElementById('imgPreview');
          imgElement.src = base64Image;
          imgElement.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function loadPosts() {
      const savedPosts = JSON.parse(localStorage.getItem('userPosts')) || [];
      const allPosts = [...savedPosts, ...defaultPosts];
      const feed = document.getElementById('postsFeed');
      feed.innerHTML = '';

      allPosts.forEach(post => {
        const imgTag = post.image ? `<img src="${post.image}" class="feed-img" alt="صورة المنشور">` : '';
        feed.innerHTML += `
          <div class="feed-card">
            <div class="feed-header">
              <div class="avatar">${post.avatar}</div>
              <div>
                <div class="feed-user">${post.author}</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">${post.time}</div>
              </div>
            </div>
            <div class="feed-content">${post.content}</div>
            ${imgTag}
            <div class="feed-actions">
              <span class="action-item" onclick="this.style.color='#ef4444'">❤️ إعجاب</span>
              <span class="action-item" onclick="alert('قسم التعليقات قريباً!')">💬 تعليق</span>
            </div>
          </div>
        `;
      });
    }

    function openPostModal() {
      document.getElementById('postModal').style.display = 'flex';
    }

    function closePostModal() {
      document.getElementById('postModal').style.display = 'none';
      document.getElementById('postText').value = '';
      document.getElementById('postImageInput').value = '';
      document.getElementById('imgPreview').style.display = 'none';
      base64Image = "";
    }

    function publishPost() {
      const text = document.getElementById('postText').value.trim();
      if (!text && !base64Image) { alert('يرجى كتابة نص أو إرفاق صورة'); return; }

      const user = JSON.parse(localStorage.getItem('currentUser')) || { name: 'مستخدم جديد' };
      const newPost = {
        author: user.name,
        avatar: user.name.charAt(0).toUpperCase(),
        time: "الآن",
        content: text,
        image: base64Image
      };

      const savedPosts = JSON.parse(localStorage.getItem('userPosts')) || [];
      savedPosts.unshift(newPost);
      localStorage.setItem('userPosts', JSON.stringify(savedPosts));

      closePostModal();
      loadPosts();
    }

    window.onload = loadPosts;
  </script>
</body>
</html>
