<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

    body { font-family: system-ui, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #2563eb; }
    .status { padding: 8px 12px; border-radius: 8px; background-color: #dcfce7; color: #166534; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">

    <p>منصة الاتصال والطباعة عند الطلب</p>
    <div id="status" class="status">جاري الاتصال...</div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    const firebaseConfig = {
      apiKey: "AIzaSyBwn1cYeo-jP-ccBMZR",
      authDomain: "sharikihub.firebaseapp.com",
      projectId: "sharikihub",
      storageBucket: "sharikihub.firebasestorage.app",
      messagingSenderId: "393020794820",
      appId: "1:393020794820:web:1a6a55",
      measurementId: "G-QL47SXGDPR"
    };
    try {
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      document.getElementById("status").innerText = "تم ربط قاعدة البيانات بنجاح! ✅";
    } catch (e) {
      document.getElementById("status").innerText = "خطأ في الاتصال ❌";
    }
  </script>
</body>
</html>
