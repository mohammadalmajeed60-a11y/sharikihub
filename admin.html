<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - لوحة الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #181b2a; border-radius: 20px; padding: 25px; border: 1px solid #2d3250; }
        h1 { text-align: center; color: #a29bfe; font-size: 22px; margin-bottom: 20px; font-weight: 900; }
        
        .admin-card { 
            background: #2d3250; 
            border-radius: 15px; 
            padding: 20px; 
            border-right: 5px solid #00b894; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .admin-card h3 { color: #fd79a8; font-size: 16px; margin-bottom: 8px; }
        .admin-card p { color: #b2bec3; font-size: 14px; line-height: 1.6; }
        
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #a29bfe; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ لوحة إدارة SharikiHub</h1>

    <div class="admin-card">
        <h3>📊 حالة النظام</h3>
        <p>جميع الأقسام (استوديو الطباعة، الترفيه، والصفحة الرئيسية) تعمل الآن بكفاءة وبأحدث تصميم عصري.</p>
    </div>

    <a href="index.html" class="btn-back">🏠 العودة للرئيسية</a>
</div>

</body>
</html>
