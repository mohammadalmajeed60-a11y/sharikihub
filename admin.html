<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .dashboard { max-width: 600px; margin: auto; }
        .header { margin-bottom: 20px; }
        
        /* بطاقات الإحصائيات */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { font-size: 12px; color: #777; }
        .card p { font-size: 18px; font-weight: bold; margin-top: 5px; }

        /* جدول الطلبات */
        .orders { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; font-size: 13px; }
        .status-new { color: #28a745; font-weight: bold; }
        
        .btn-home { display: block; margin-top: 20px; text-align: center; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>لوحة التحكم</h1>
        <p>مرحباً بك يا مدير المنصة</p>
    </div>

    <div class="stats">
        <div class="card"><h3>إجمالي الطلبات</h3><p>12</p></div>
        <div class="card"><h3>الطلبات الجديدة</h3><p>3</p></div>
    </div>

    <div class="orders">
        <h2>أحدث الطلبات</h2>
        <table>
            <tr><th>العميل</th><th>المنتج</th><th>الحالة</th></tr>
            <tr><td>أحمد س.</td><td>تيشرت</td><td class="status-new">جديد</td></tr>
            <tr><td>سارة م.</td><td>كوب</td><td class="status-new">جديد</td></tr>
            <tr><td>خالد ع.</td><td>تيشرت</td><td>جاري التنفيذ</td></tr>
        </table>
    </div>

    <a href="index.html" class="btn-home">← العودة للرئيسية</a>
</div>

</body>
</html>
