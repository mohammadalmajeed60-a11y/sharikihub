<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - الملف الشخصي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .container {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* بطاقة المستخدم */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      border: 2px solid #38bdf8;
    }

    .user-name {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .user-email {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* القوائم والخيارات */
    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 15px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #10b981;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">👤 الملف الشخصي والإعدادات</div>
  </header>

  <div class="container">
    <!-- بطاقة البيانات الشخصية -->
    <div class="profile-card">
      <div class="avatar">👤</div>
      <div class="user-name">مستخدم SharikiHub</div>
      <div class="user-email">user@sharikihub.com</div>
    </div>

    <!-- قائمة الخيارات والمتابعة -->
    <div class="menu-card">
      <a href="cart.html" class="menu-item">
        <div class="menu-info">
          <span>📦 طلباتي ومشترياتي</span>
        </div>
        <span class="badge">قيد التوصيل</span>
      </a>

      <a href="design-studio.html" class="menu-item">
        <div class="menu-info">
          <span>🎨 تصاميمي المحفوظة</span>
        </div>
        <span>←</span>
      </a>

      <a href="chat.html" class="menu-item">
        <div class="menu-info">
          <span>💬 رسائل الدعم الفني</span>
        </div>
        <span>←</span>
      </a>

      <div class="menu-item" onclick="alert('تغيير الإعدادات قريباً!')">
        <div class="menu-info">
          <span>⚙️ إعدادات الحساب</span>
        </div>
        <span>←</span>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item active">👤 الملف</a>
  </nav>

</body>
</html>
