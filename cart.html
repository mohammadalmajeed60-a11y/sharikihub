<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - السلة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body { background-color: var(--bg-main); color: var(--text); padding-bottom: 80px; }

    header { background-color: var(--card-bg); padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
    .header-title { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    .container { padding: 15px; }

    /* عناصر السلة */
    .cart-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .item-details { display: flex; flex-direction: column; gap: 5px; }
    .item-name { font-weight: bold; }
    .item-price { color: var(--accent); font-size: 0.9rem; }

    .cart-summary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .total-price { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }

    .btn-checkout {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🛒 سلة المشتريات</div>
  </header>

  <div class="container">
    <!-- قائمة المنتجات -->
    <div class="cart-item">
      <div class="item-details">
        <div class="item-name">تيشيرت شاركي</div>
        <div class="item-price">120 ريال</div>
      </div>
      <button onclick="alert('تم الحذف')" style="background:transparent; border:none; color:#ef4444; cursor:pointer;">حذف</button>
    </div>

    <div class="cart-item">
      <div class="item-details">
        <div class="item-name">كوب السعادة</div>
        <div class="item-price">45 ريال</div>
      </div>
      <button onclick="alert('تم الحذف')" style="background:transparent; border:none; color:#ef4444; cursor:pointer;">حذف</button>
    </div>

    <!-- الملخص -->
    <div class="cart-summary">
      <div class="total-price">
        <span>الإجمالي:</span>
        <span>165 ريال</span>
      </div>
      <button class="btn-checkout" onclick="alert('تم إتمام الطلب بنجاح!')">إتمام الطلب</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
  </nav>

</body>
</html>
