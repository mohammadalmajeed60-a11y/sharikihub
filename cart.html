<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - سلة التسوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

    .container { padding: 15px; display: flex; flex-direction: column; gap: 15px; }

    /* عناصر السلة */
    .cart-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-info { display: flex; align-items: center; gap: 12px; }
    .item-icon { font-size: 2rem; }
    .item-title { font-weight: bold; font-size: 0.95rem; }
    .item-sub { font-size: 0.8rem; color: var(--text-muted); }

    .item-price { font-weight: bold; color: #38bdf8; font-size: 1rem; }
    .remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; }

    /* ملخص الفاتورة وإتمام الطلب */
    .checkout-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .total-row {
      font-weight: bold;
      font-size: 1.1rem;
      color: #38bdf8;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .input-field {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      outline: none;
      font-size: 0.85rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }

    .nav-item {
      color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🛒 سلة التسوق</div>
    <a href="design-studio.html" style="color: var(--accent); text-decoration: none; font-size: 0.85rem;">+ إضافة تصميم</a>
  </header>

  <div class="container">
    <!-- قائمة المنتجات -->
    <div id="cartList" style="display: flex; flex-direction: column; gap: 10px;">
      <!-- سيتم التوليد تلقائياً -->
    </div>

    <!-- ملخص الحساب والشحن -->
    <div class="checkout-box" id="checkoutBox">
      <h3 style="font-size: 1rem;">تفاصيل الشحن وإتمام الطلب</h3>
      <input type="text" id="shippingAddress" class="input-field" placeholder="العنوان بالتفصيل (المدينة، الشارع)...">
      <input type="tel" id="shippingPhone" class="input-field" placeholder="رقم الهاتف للتواصل...">

      <div class="summary-row total-row">
        <span>المجموع الكلي:</span>
        <span id="totalPrice">0 $</span>
      </div>

      <button class="checkout-btn" onclick="submitOrder()">تأكيد وإرسال الطلب 📦</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('userCart')) || [];
      const cartList = document.getElementById('cartList');
      const checkoutBox = document.getElementById('checkoutBox');
      cartList.innerHTML = '';

      if (cart.length === 0) {
        cartList.innerHTML = `
          <div class="empty-cart">
            <div style="font-size: 3rem; margin-bottom: 10px;">🛒</div>
            <p>سلة التسوق فارغة حالياً</p>
            <a href="design-studio.html" style="color: var(--accent); text-decoration: underline; display: inline-block; margin-top: 10px;">اذهب للستوديو وصمم منتجك الأول</a>
          </div>
        `;
        checkoutBox.style.display = 'none';
        return;
      }

      checkoutBox.style.display = 'flex';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        cartList.innerHTML += `
          <div class="cart-item">
            <div class="item-info">
              <div class="item-icon" style="color:${item.color}">${item.icon}</div>
              <div>
                <div class="item-title">${item.name}</div>
                <div class="item-sub">النص: "${item.text}"</div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span class="item-price">${item.price} $</span>
              <button class="remove-btn" onclick="removeItem(${index})">🗑️</button>
            </div>
          </div>
        `;
      });

      document.getElementById('totalPrice').innerText = total + ' $';
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem('userCart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('userCart', JSON.stringify(cart));
      loadCart();
    }

    function submitOrder() {
      const address = document.getElementById('shippingAddress').value.trim();
      const phone = document.getElementById('shippingPhone').value.trim();

      if (!address || !phone) {
        alert('يرجى تعبئة العنوان ورقم الهاتف لإكمال الطلب');
        return;
      }

      alert('تم إرسال طلبك بنجاح! سيتواصل معك فريق الشحن قريباً.');
      localStorage.removeItem('userCart');
      loadCart();
    }

    window.onload = loadCart;
  </script>
</body>
</html>
