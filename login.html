<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 15px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-auth span {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-title" id="formTitle">تسجيل الدخول إلى SharikiHub</div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label>اسم المستخدم</label>
        <input type="text" id="userName" class="form-input" placeholder="أدخل اسمك">
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="userEmail" class="form-input" placeholder="example@mail.com" required>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="userPass" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">دخول</button>
    </form>

    <div class="toggle-auth" onclick="toggleAuthMode()">
      <span id="toggleText">ليس لديك حساب؟ إنشاء حساب جديد</span>
    </div>
  </div>

  <script>
    let isSignUp = false;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('formTitle').innerText = isSignUp ? 'إنشاء حساب جديد' : 'تسجيل الدخول إلى SharikiHub';
      document.getElementById('nameGroup').style.display = isSignUp ? 'block' : 'none';
      document.getElementById('submitBtn').innerText = isSignUp ? 'إنشاء الحساب' : 'دخول';
      document.getElementById('toggleText').innerText = isSignUp ? 'لديك حساب بالفعل؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب جديد';
    }

    function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('userEmail').value;
      const name = isSignUp ? document.getElementById('userName').value : email.split('@')[0];

      // حفظ البيانات محلياً في الجوال
      localStorage.setItem('currentUser', JSON.stringify({ name: name, email: email, isLogged: true }));

      alert(isSignUp ? 'تم إنشاء الحساب بنجاح!' : 'تم تسجيل الدخول بنجاح!');
      window.location.href = 'admin.html'; // التوجيه للملف الشخصي
    }
  </script>
</body>
</html>
