<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول - SharikiHub</title>
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #1a2232;
      --border: #2a364f;
      --text: #f8fafc;
      --accent: #2563eb;
      --purple-accent: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .logo { font-size: 3rem; margin-bottom: 20px; }
    .title { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; color: #38bdf8; }

    .input-field {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .input-field:focus { border-color: var(--purple-accent); }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--purple-accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .login-btn:hover { opacity: 0.9; }

    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">🔑</div>
    <div class="title">تسجيل الدخول إلى SharikiHub</div>
    
    <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح!'); window.location.href='index.html';">
      <input type="email" class="input-field" placeholder="البريد الإلكتروني" required>
      <input type="password" class="input-field" placeholder="كلمة المرور" required>
      <button type="submit" class="login-btn">دخول</button>
    </form>

    <a href="index.html" class="back-link">العودة للرئيسية</a>
  </div>

</body>
</html>
