<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الريلز - SharikiHub</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .brand { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
    .add-reel-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { padding: 15px; display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 0 auto; }

    .reel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .reel-header {
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .reel-user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 35px; height: 35px; border-radius: 50%;
      background: var(--accent); display: flex;
      align-items: center; justify-content: center; font-weight: bold;
    }

    .reel-video-wrapper {
      position: relative;
      background: #000;
      width: 100%;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-video {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
    }

    .reel-caption {
      padding: 10px 15px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .reel-actions {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border);
      padding: 10px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .action-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .action-btn.liked { color: #ef4444; font-weight: bold; }
    .action-btn.saved { color: #f59e0b; font-weight: bold; }

    /* التعليقات */
    .comments-modal {
      display: none;
      padding: 10px 15px 15px;
      border-top: 1px dashed var(--border);
      background: #162032;
    }

    .comment-list { max-height: 120px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .comment-item { background: var(--card-bg); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }

    .comment-input-box { display: flex; gap: 6px; }
    .comment-input {
      flex: 1; background: var(--bg-main); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 6px 10px; font-size: 0.8rem;
    }
    .comment-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

    /* النافذة المنبثقة لإضافة ريلز */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      justify-content: center; align-items: center; padding: 20px;
    }

    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; width: 100%; max-width: 450px; padding: 20px;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-input {
      width: 100%; background: var(--bg-main); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 10px; outline: none; margin-bottom: 10px; font-size: 0.85rem;
    }

    .post-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }

    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🎬 ريلز SharikiHub</div>
    <button class="add-reel-btn" onclick="openReelModal()">➕ نشر ريلز</button>
  </header>

  <div class="container" id="reelsFeed"></div>

  <!-- نافذة رفع ريلز جديد -->
  <div class="modal" id="reelModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>نشر فيديو ريلز جديد</h3>
        <span style="cursor:pointer;" onclick="closeReelModal()">❌</span>
      </div>
      <input type="text" id="reelCaptionInput" class="modal-input" placeholder="اكتب وصفاً للفيديو...">
      <div style="margin-bottom: 12px;">
        <label for="reelVideoInput" style="background:#334155; color:#fff; padding:8px 12px; border-radius:6px; font-size:0.85rem; cursor:pointer; display:inline-block;">🎥 اختيار فيديو من الهاتف</label>
        <input type="file" id="reelVideoInput" accept="video/*" style="display:none" onchange="handleVideoSelect(event)">
        <p id="videoFileName" style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;"></p>
      </div>
      <button class="post-btn" onclick="publishReel()">نشر الريلز الآن 🚀</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item active">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="auth.html" class="nav-item">👤 حسابي</a>
  </nav>

  <script>
    let selectedVideoSrc = "";

    const defaultReels = [
      {
        id: 1,
        author: "إدارة المنصة",
        avatar: "S",
        caption: "أهلاً بكم في قسم الريلز التجريبي! 🚀",
        videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4"
      }
    ];

    function openReelModal() { document.getElementById('reelModal').style.display = 'flex'; }
    function closeReelModal() {
      document.getElementById('reelModal').style.display = 'none';
      document.getElementById('reelCaptionInput').value = '';
      document.getElementById('reelVideoInput').value = '';
      document.getElementById('videoFileName').innerText = '';
      selectedVideoSrc = "";
    }

    function handleVideoSelect(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('videoFileName').innerText = "تم اختيار: " + file.name;
        selectedVideoSrc = URL.createObjectURL(file);
      }
    }

    function loadReels() {
      const savedReels = JSON.parse(localStorage.getItem('userReels')) || [];
      const allReels = [...savedReels, ...defaultReels];
      const feed = document.getElementById('reelsFeed');
      feed.innerHTML = '';

      allReels.forEach((reel, index) => {
        const reelId = reel.id || index;
        feed.innerHTML += `
          <div class="reel-card" id="reel-card-${reelId}">
            <div class="reel-header">
              <div class="reel-user-info">
                <div class="avatar">${reel.avatar}</div>
                <strong style="font-size:0.9rem;">${reel.author}</strong>
              </div>
              <div style="display:flex; gap:10px;">
                <button class="action-btn" onclick="reportReel(${reelId})">⚠️ بلاغ</button>
                <button class="action-btn" style="color:#ef4444;" onclick="removeReel(${reelId})">🗑️ إزالة</button>
              </div>
            </div>

            <div class="reel-video-wrapper">
              <video class="reel-video" src="${reel.videoUrl}" controls></video>
            </div>

            <div class="reel-caption">${reel.caption}</div>

            <div class="reel-actions">
              <button class="action-btn" onclick="this.classList.toggle('liked')">❤️ إعجاب</button>
              <button class="action-btn" onclick="toggleReelComments(${reelId})">💬 تعليق</button>
              <button class="action-btn" onclick="toggleSaveReel(this)">🔖 حفظ</button>
            </div>

            <div class="comments-modal" id="reel-comments-${reelId}">
              <div class="comment-list" id="reel-comment-list-${reelId}"></div>
              <div class="comment-input-box">
                <input type="text" class="comment-input" id="reel-comment-input-${reelId}" placeholder="اكتب تعليقاً...">
                <button class="comment-btn" onclick="addReelComment(${reelId})">إرسال</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function publishReel() {
      const caption = document.getElementById('reelCaptionInput').value.trim();
      if (!selectedVideoSrc && !caption) { alert('يرجى اختيار فيديو أو كتابة وصف!'); return; }

      const user = JSON.parse(localStorage.getItem('currentUser')) || { name: 'مستخدم جديد' };
      const newReel = {
        id: Date.now(),
        author: user.name,
        avatar: user.name.charAt(0).toUpperCase(),
        caption: caption,
        videoUrl: selectedVideoSrc || "https://www.w3schools.com/html/mov_bbb.mp4"
      };

      const savedReels = JSON.parse(localStorage.getItem('userReels')) || [];
      savedReels.unshift(newReel);
      localStorage.setItem('userReels', JSON.stringify(savedReels));

      closeReelModal();
      loadReels();
    }

    function toggleReelComments(reelId) {
      const box = document.getElementById(`reel-comments-${reelId}`);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function addReelComment(reelId) {
      const input = document.getElementById(`reel-comment-input-${reelId}`);
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById(`reel-comment-list-${reelId}`);
      const commentDiv = document.createElement('div');
      commentDiv.className = 'comment-item';
      commentDiv.innerText = text;
      list.appendChild(commentDiv);
      input.value = '';
    }

    function toggleSaveReel(btn) {
      btn.classList.toggle('saved');
      alert(btn.classList.contains('saved') ? 'تم حفظ الريلز في المحفوظات!' : 'تم إلغاء الحفظ');
    }

    function reportReel(reelId) {
      alert('تم تقديم الإبلاغ للإدارة بنجاح. سنراجع الفيديو قريباً!');
    }

    function removeReel(reelId) {
      if (confirm('هل أنت تأكد من العزم على إخفاء أو التخلص من هذا الريلز؟')) {
        const card = document.getElementById(`reel-card-${reelId}`);
        if (card) card.remove();
      }
    }

    window.onload = loadReels;
  </script>
</body>
</html>
