<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - ريلز وستوري</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* حاوي الفيديوهات الرأسي */
    .reels-container {
      height: calc(100vh - 60px);
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    .reel-card {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* فيديو العرض */
    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* عناصر التحكم والتفاعل الجانبية */
    .reel-actions {
      position: absolute;
      left: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .action-btn.liked {
      color: #ef4444;
    }

    .action-count {
      font-size: 0.75rem;
      color: #fff;
      text-align: center;
      margin-top: 2px;
    }

    /* تفاصيل الفيديو بالأسفل */
    .reel-info {
      position: absolute;
      bottom: 20px;
      right: 15px;
      left: 70px;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .reel-user {
      font-weight: bold;
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    .reel-desc {
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.3;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="reels-container">
    
    <!-- فيديو 1 -->
    <div class="reel-card">
      <video class="reel-video" loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-fashion-model-in-a-black-suit-41583-large.mp4"></video>
      
      <div class="reel-actions">
        <div>
          <button class="action-btn" onclick="toggleLike(this)">❤️</button>
          <div class="action-count">1.2k</div>
        </div>
        <div>
          <button class="action-btn" onclick="alert('قسم التعليقات قريباً!')">💬</button>
          <div class="action-count">254</div>
        </div>
        <div>
          <button class="action-btn" onclick="alert('تم نسخ رابط الفيديو!')">🔗</button>
          <div class="action-count">مشاركة</div>
        </div>
      </div>

      <div class="reel-info">
        <div class="reel-user">@shariki_fashion</div>
        <div class="reel-desc">استعرض أحدث تصاميم الملابس والمطبوعات الجديدة الخاصة بنا! 👕🔥</div>
      </div>
    </div>

    <!-- فيديو 2 -->
    <div class="reel-card">
      <video class="reel-video" loop playsinline src="https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-green-screen-41528-large.mp4"></video>
      
      <div class="reel-actions">
        <div>
          <button class="action-btn" onclick="toggleLike(this)">❤️</button>
          <div class="action-count">850</div>
        </div>
        <div>
          <button class="action-btn" onclick="alert('قسم التعليقات قريباً!')">💬</button>
          <div class="action-count">98</div>
        </div>
        <div>
          <button class="action-btn" onclick="alert('تم نسخ رابط الفيديو!')">🔗</button>
          <div class="action-count">مشاركة</div>
        </div>
      </div>

      <div class="reel-info">
        <div class="reel-user">@tech_hub</div>
        <div class="reel-desc">تصميم كفرات الجواتف والتخصيص المباشر من التطبيق 📱✨</div>
      </div>
    </div>

  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item active">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function toggleLike(btn) {
      btn.classList.toggle('liked');
    }

    // تشغيل الفيديو الظاهر فقط عند التمرير
    const videos = document.querySelectorAll('video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.play();
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.6 });

    videos.forEach(video => observer.observe(video));
  </script>
</body>
</html>
