<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - ريلز</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #000;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* حاوية الريلز والتمرير العمودي */
    .reels-feed {
      height: calc(100vh - 60px);
      overflow-y: scroll;
      snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .reel-card {
      height: 100%;
      width: 100%;
      snap-align: start;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* تفاصيل المقطع */
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      right: 15px;
      left: 70px;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .reel-user {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #38bdf8;
    }

    .reel-desc {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.3;
    }

    /* أزرار التفاعل الجانبية */
    .reel-actions {
      position: absolute;
      left: 15px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .action-count {
      font-size: 0.75rem;
      margin-top: 2px;
      color: #cbd5e1;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="reels-feed">
    
    <!-- فيديو 1 -->
    <div class="reel-card">
      <video class="reel-video" loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4"></video>
      
      <div class="reel-overlay">
        <div class="reel-user">@تصميم_المتجر</div>
        <div class="reel-desc">استعراض لأحدث طباعة على المطبوعات في SharikiHub 🎨✨</div>
      </div>

      <div class="reel-actions">
        <button class="action-btn" onclick="likeReel(this)">❤️ <span class="action-count">142</span></button>
        <button class="action-btn">💬 <span class="action-count">24</span></button>
        <button class="action-btn">🔄 <span class="action-count">8</span></button>
      </div>
    </div>

    <!-- فيديو 2 -->
    <div class="reel-card">
      <video class="reel-video" loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-neon-sign-42898-large.mp4"></video>
      
      <div class="reel-overlay">
        <div class="reel-user">@مجلس_الرياضة</div>
        <div class="reel-desc">ملخص وأبرز لحظات مباراة اليوم من مجالس الرياضة ⚽🔥</div>
      </div>

      <div class="reel-actions">
        <button class="action-btn" onclick="likeReel(this)">❤️ <span class="action-count">380</span></button>
        <button class="action-btn">💬 <span class="action-count">51</span></button>
        <button class="action-btn">🔄 <span class="action-count">19</span></button>
      </div>
    </div>

  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item active">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function likeReel(btn) {
      let countSpan = btn.querySelector('.action-count');
      let count = parseInt(countSpan.innerText);
      countSpan.innerText = count + 1;
      btn.style.color = '#ef4444';
    }
  </script>
</body>
</html>
