<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - الريلز</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; }

        /* حاوية الفيديو الشبيهة بتطبيق إنستغرام/تيك توك */
        .reels-container { width: 100vw; height: 100vh; snap-type: y mandatory; overflow-y: scroll; scroll-behavior: smooth; }
        .reel-card { width: 100vw; height: 100vh; snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }

        /* إطار الفيديو */
        .reel-card video { width: 100%; height: 100%; object-fit: cover; }

        /* أزرار التفاعل الجانبية */
        .actions-sidebar { position: absolute; left: 15px; bottom: 80px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .action-btn { background: rgba(0, 0, 0, 0.4); border: none; color: #fff; font-size: 20px; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); }
        .action-count { font-size: 12px; margin-top: 4px; }

        /* تفاصيل المقطع والمعلومات */
        .reel-info { position: absolute; right: 15px; bottom: 30px; left: 80px; z-index: 10; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .user-name { font-size: 16px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .caption { font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>

<div class="reels-container">
    
    <!-- المقطع الأول -->
    <div class="reel-card">
        <video loop onclick="togglePlay(this)">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-skater-performing-a-trick-41584-large.mp4" type="video/mp4">
        </video>
        
        <div class="actions-sidebar">
            <div><button class="action-btn" onclick="likeReel(this)">❤️</button><div class="action-count">1.2K</div></div>
            <div><button class="action-btn">💬</button><div class="action-count">84</div></div>
            <div><button class="action-btn">🔗</button><div class="action-count">مشاركة</div></div>
        </div>

        <div class="reel-info">
            <div class="user-name">@mohammad_almajeed</div>
            <div class="caption">تجربة تصميم واجهة الريلز على الهاتف 🚀🔥 #SharikiHub</div>
        </div>
    </div>

    <!-- المقطع الثاني -->
    <div class="reel-card">
        <video loop onclick="togglePlay(this)">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-young-woman-holding-a-cup-of-coffee-41312-large.mp4" type="video/mp4">
        </video>
        
        <div class="actions-sidebar">
            <div><button class="action-btn" onclick="likeReel(this)">❤️</button><div class="action-count">850</div></div>
            <div><button class="action-btn">💬</button><div class="action-count">32</div></div>
            <div><button class="action-btn">🔗</button><div class="action-count">مشاركة</div></div>
        </div>

        <div class="reel-info">
            <div class="user-name">@creative_designs</div>
            <div class="caption">طباعة تصميم مخصص على الكوب ☕✨ #PrintOnDemand</div>
        </div>
    </div>

</div>

<script>
    // التشغيل واليقاف عند الضغط على الشاشة
    function togglePlay(video) {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }

    // تفاعل زر الاعجاب
    function likeReel(btn) {
        if (btn.style.color === 'red') {
            btn.style.color = '#fff';
        } else {
            btn.style.color = 'red';
        }
    }
</script>

</body>
</html>
