<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SharikiHub - الريلز والمنشورات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding-bottom: 80px; }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: #181b2a; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2d3250;
        }
        .header h2 { font-size: 20px; font-weight: 900; color: #a29bfe; }
        
        /* Reels Container */
        .reels-container {
            display: flex; flex-direction: column; gap: 20px;
            padding: 15px; max-width: 500px; margin: 0 auto;
        }

        .reel-card {
            position: relative; background: #181b2a;
            border-radius: 20px; overflow: hidden;
            border: 1px solid #2d3250; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .reel-video {
            width: 100%; height: 420px; object-fit: cover; display: block;
        }

        .reel-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 20px; background: linear-gradient(transparent, rgba(15, 17, 26, 0.95));
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        .reel-info h4 { font-size: 16px; color: #fd79a8; margin-bottom: 5px; }
        .reel-info p { font-size: 13px; color: #b2bec3; }

        .reel-actions {
            display: flex; flex-direction: column; gap: 15px; align-items: center;
        }

        .action-btn {
            background: rgba(45, 50, 80, 0.8); border: none; color: #fff;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.85); }
        .action-btn span { font-size: 10px; color: #b2bec3; margin-top: 2px; }

        /* Navigation Bar */
        .nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #181b2a; border-top: 1px solid #2d3250;
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item { text-decoration: none; color: #b2bec3; font-size: 12px; font-weight: 700; text-align: center; display: flex; flex-direction: column; gap: 4px; }
        .nav-item.active { color: #ff7675; }
    </style>
</head>
<body>

<div class="header">
    <h2>🎬 ريلز SharikiHub</h2>
    <span style="font-size: 20px;">🔥</span>
</div>

<div class="reels-container">
    <!-- Reel Item 1 -->
    <div class="reel-card">
        <video class="reel-video" controls poster="https://images.unsplash.com/photo-1513346940221-6f673d962e97?w=500">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-fashion-model-in-a-neon-environment-40348-large.mp4" type="video/mp4">
        </video>
        <div class="reel-overlay">
            <div class="reel-info">
                <h4>@SharikiDesign</h4>
                <p>استعراض أحدث تصاميم الطباعة النيون 🎨✨</p>
            </div>
            <div class="reel-actions">
                <button class="action-btn" onclick="like(this)">❤️<span class="count">124</span></button>
                <button class="action-btn" onclick="alert('قسم التعليقات قادماً قريباً!')">💬<span>18</span></button>
                <button class="action-btn" onclick="share()">🔗<span>مشاركة</span></button>
            </div>
        </div>
    </div>

    <!-- Reel Item 2 -->
    <div class="reel-card">
        <video class="reel-video" controls poster="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-controller-while-playing-video-games-41221-large.mp4" type="video/mp4">
        </video>
        <div class="reel-overlay">
            <div class="reel-info">
                <h4>@SharikiGames</h4>
                <p>تحديات ركن الترفيه الجديدة 🎲🎮</p>
            </div>
            <div class="reel-actions">
                <button class="action-btn" onclick="like(this)">❤️<span class="count">89</span></button>
                <button class="action-btn" onclick="alert('قسم التعليقات قادماً قريباً!')">💬<span>5</span></button>
                <button class="action-btn" onclick="share()">🔗<span>مشاركة</span></button>
            </div>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="index.html" class="nav-item"><span>🏠</span>الرئيسية</a>
    <a href="reels.html" class="nav-item active"><span>🎬</span>الريلز</a>
    <a href="design-studio.html" class="nav-item"><span>🎨</span>الاستوديو</a>
    <a href="entertainment.html" class="nav-item"><span>🎮</span>الترفيه</a>
</nav>

<script>
    function like(btn) {
        const countSpan = btn.querySelector('.count');
        let count = parseInt(countSpan.innerText);
        countSpan.innerText = count + 1;
        btn.style.color = '#ff7675';
    }
    function share() {
        if (navigator.share) {
            navigator.share({ title: 'SharikiHub Reels', url: window.location.href });
        } else {
            alert('تم نسخ رابط الريلز!');
        }
    }
</script>

</body>
</html>
