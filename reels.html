<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SharikiHub - ريلز والترفيه</title>
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #1a2232;
      --border: #2a364f;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --purple-accent: #8b5cf6;
      --gold-gradient: linear-gradient(135deg, #ffd700, #b8860b);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    html, body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* الهيدر العلوي */
    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }

    .gold-key-btn {
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      text-decoration: none;
    }

    /* حاوية عرض الريلز */
    .reels-container {
      flex: 1;
      overflow-y: scroll;
      snap-type: y mandatory;
      padding-bottom: 60px;
    }

    .reel-card {
      height: calc(100vh - 120px);
      snap-align: start;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .reel-placeholder {
      font-size: 5rem;
      opacity: 0.8;
    }

    /* تفاصيل الفيديو */
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      right: 15px;
      left: 70px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .reel-desc {
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.3;
    }

    /* أزرار التفاعل الجانبية */
    .action-bar {
      position: absolute;
      left: 15px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action-btn {
      background: rgba(26, 34, 50, 0.6);
      border: 1px solid var(--border);
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .action-count {
      font-size: 0.75rem;
      margin-top: 2px;
      color: var(--text-muted);
    }

    /* الشريط السفلي المثبت */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--purple-accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🎬 ريلز SharikiHub</div>
    <a href="index.html" class="gold-key-btn">🗝️ المفتاح الذهبي</a>
  </header>

  <div class="reels-container">
    <!-- فيديو 1 -->
    <div class="reel-card">
      <div class="reel-placeholder">👕🎨</div>
      <div class="reel-overlay">
        <div class="user-info">@استوديو_التصميم</div>
        <div class="reel-desc">استعراض أحدث تصاميم القمصان الخاصة ببطولات كرة القدم ⚽🔥</div>
      </div>
      <div class="action-bar">
        <button class="action-btn" onclick="likeReel(this)">❤️</button>
        <button class="action-btn" onclick="alert('قسم التعليقات قيد التطوير')">💬</button>
        <button class="action-btn" onclick="alert('تم نسخ رابط الريل!')">🔗</button>
      </div>
    </div>

    <!-- فيديو 2 -->
    <div class="reel-card">
      <div class="reel-placeholder">📚🍿</div>
      <div class="reel-overlay">
        <div class="user-info">@عالم_الكتب</div>
        <div class="reel-desc">ترشيحات أفضل 3 كتب ومارثون الأفلام لهذا الأسبوع 📖🎬</div>
      </div>
      <div class="action-bar">
        <button class="action-btn" onclick="likeReel(this)">❤️</button>
        <button class="action-btn" onclick="alert('قسم التعليقات قيد التطوير')">💬</button>
        <button class="action-btn" onclick="alert('تم نسخ رابط الريل!')">🔗</button>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي المثبت -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item active">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="index.html" class="nav-item">👤 حسابي</a>
  </nav>

  <script>
    function likeReel(btn) {
      if (btn.style.color === 'red') {
        btn.style.color = 'white';
      } else {
        btn.style.color = 'red';
      }
    }
  </script>
</body>
</html>
