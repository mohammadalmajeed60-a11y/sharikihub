<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المتجر والتصميم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .container {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #334155;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-price {
      font-size: 0.85rem;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* شريط التنقل السفلي المثبت */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🛍️ متجر التصاميم والمطبوعات</div>
  </header>

  <div class="container">
    <div class="products-grid">
      
      <div class="product-card">
        <div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">👕</div>
        <div class="product-title">تيشرت مطبوع</div>
        <div class="product-price">15 $</div>
        <button class="btn-action">تخصيص وتصميم</button>
      </div>

      <div class="product-card">
        <div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">☕</div>
        <div class="product-title">كوب سيراميك</div>
        <div class="product-price">8 $</div>
        <button class="btn-action">تخصيص وتصميم</button>
      </div>

      <div class="product-card">
        <div class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">🧢</div>
        <div class="product-title">قبعة رياضية</div>
        <div class="product-price">10 $</div>
        <button class="btn-action">تخصيص وتصميم</button>
      </div>

    </div>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item active">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

</body>
</html>
