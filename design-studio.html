<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - استديو التصميم والطباعة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .container {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* منطقة المعاينة المباشرة */
    .preview-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .product-base {
      font-size: 7.5rem;
      user-select: none;
    }

    .custom-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: 75%;
      z-index: 10;
    }

    .logo-preview {
      max-width: 70px;
      max-height: 70px;
      object-fit: contain;
      display: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .custom-text-overlay {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      word-break: break-word;
      text-align: center;
    }

    /* أدوات التحكم والتخصيص */
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .product-grid-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .select-btn {
      padding: 10px 5px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .select-btn.active {
      border-color: var(--accent);
      background: var(--accent);
    }

    .text-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: #fff;
      outline: none;
    }

    .upload-btn-label {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--bg-main);
      border: 1px dashed var(--accent);
      color: #38bdf8;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .color-picker {
      display: flex;
      gap: 10px;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #10b981;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🎨 استديو الطباعة والتصميم</div>
  </header>

  <div class="container">
    <!-- منطقة المعاينة المباشرة -->
    <div class="preview-box">
      <div class="product-base" id="productBase">🧥</div>
      <div class="custom-overlay">
        <img id="logoPreview" class="logo-preview" alt="الشعار">
        <div class="custom-text-overlay" id="textOverlay">نص التصميم</div>
      </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-card">
      <div>
        <div class="control-label">اختر المنتج:</div>
        <div class="product-grid-selector">
          <button class="select-btn active" onclick="setProduct('🧥', this)">🧥 هودي</button>
          <button class="select-btn" onclick="setProduct('📱', this)">📱 كفر جوال</button>
          <button class="select-btn" onclick="setProduct('👔', this)">👔 قميص</button>
          <button class="select-btn" onclick="setProduct('👕', this)">👕 تيشرت</button>
          <button class="select-btn" onclick="setProduct('☕', this)">☕ كوب</button>
          <button class="select-btn" onclick="setProduct('🧢', this)">🧢 قبعة</button>
        </div>
      </div>

      <div>
        <div class="control-label">رفع شعار أو صورة:</div>
        <label class="upload-btn-label">
          📷 اضغط لرفع صورة من الاستوديو
          <input type="file" id="logoInput" accept="image/*" style="display: none;" onchange="handleLogoUpload(event)">
        </label>
      </div>

      <div>
        <div class="control-label">اكتب النص المطبوع:</div>
        <input type="text" class="text-input" id="inputCustomText" value="نص التصميم" oninput="updateText(this.value)">
      </div>

      <div>
        <div class="control-label">لون النص:</div>
        <div class="color-picker">
          <div class="color-dot" style="background: #ffffff;" onclick="setTextColor('#ffffff')"></div>
          <div class="color-dot" style="background: #f59e0b;" onclick="setTextColor('#f59e0b')"></div>
          <div class="color-dot" style="background: #ef4444;" onclick="setTextColor('#ef4444')"></div>
          <div class="color-dot" style="background: #38bdf8;" onclick="setTextColor('#38bdf8')"></div>
        </div>
      </div>

      <button class="btn-submit" onclick="orderDesign()">🛍️ حفظ التصميم وطلب المنتج</button>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item active">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function setProduct(icon, btn) {
      document.getElementById('productBase').innerText = icon;
      document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function updateText(val) {
      document.getElementById('textOverlay').innerText = val;
    }

    function setTextColor(color) {
      document.getElementById('textOverlay').style.color = color;
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const logoImg = document.getElementById('logoPreview');
        logoImg.src = URL.createObjectURL(file);
        logoImg.style.display = 'block';
      }
    }

    function orderDesign() {
      alert('تم حفظ تصميمك وشعارك بنجاح ونقله إلى طلباتك!');
    }
  </script>
</body>
</html>
