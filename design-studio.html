<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المتجر</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body { background-color: var(--bg-main); color: var(--text); padding-bottom: 80px; }

    header { background-color: var(--card-bg); padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
    .header-title { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    .container { padding: 15px; }

    /* شبكة المنتجات */
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .product-img { width: 100%; height: 140px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 2rem; }

    .product-info { padding: 10px; }
    .product-name { font-weight: bold; font-size: 0.9rem; }
    .product-price { color: var(--accent); font-weight: bold; margin: 5px 0; }
    
    .btn-buy {
      display: block;
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🛍️ استوديو التصاميم</div>
  </header>

  <div class="container">
    <div class="shop-grid">
      <!-- منتج 1 -->
      <div class="product-card">
        <div class="product-img">👕</div>
        <div class="product-info">
          <div class="product-name">تيشيرت شاركي</div>
          <div class="product-price">120 ريال</div>
          <button class="btn-buy" onclick="alert('تمت إضافة التيشيرت للسلة!')">إضافة للسلة</button>
        </div>
      </div>
      <!-- منتج 2 -->
      <div class="product-card">
        <div class="product-img">☕</div>
        <div class="product-info">
          <div class="product-name">كوب السعادة</div>
          <div class="product-price">45 ريال</div>
          <button class="btn-buy" onclick="alert('تمت إضافة الكوب للسلة!')">إضافة للسلة</button>
        </div>
      </div>
      <!-- منتج 3 -->
      <div class="product-card">
        <div class="product-img">🖼️</div>
        <div class="product-info">
          <div class="product-name">لوحة حائطية</div>
          <div class="product-price">85 ريال</div>
          <button class="btn-buy" onclick="alert('تمت إضافة اللوحة للسلة!')">إضافة للسلة</button>
        </div>
      </div>
      <!-- منتج 4 -->
      <div class="product-card">
        <div class="product-img">📱</div>
        <div class="product-info">
          <div class="product-name">كفر جوال مميز</div>
          <div class="product-price">60 ريال</div>
          <button class="btn-buy" onclick="alert('تمت إضافة الكفر للسلة!')">إضافة للسلة</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item active">🛍️ المتجر</a>
  </nav>

</body>
</html>
