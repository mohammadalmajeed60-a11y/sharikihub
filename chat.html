<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات والمجتمع</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    /* تبويبات التنقل بين أنواع الشات */
    .chat-tabs {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: bold;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* قائمة المحادثات والمجتمع */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 60px;
    }

    .chat-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
    }

    .chat-details { flex: 1; }
    .chat-title { font-weight: bold; font-size: 0.95rem; }
    .chat-preview { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="chat-tabs">
      <button class="tab-btn active" onclick="switchTab('personal')">💬 الشخصية</button>
      <button class="tab-btn" onclick="switchTab('community')">🌐 المجتمع</button>
      <button class="tab-btn" onclick="switchTab('support')">🎧 الدعم الفني</button>
    </div>
  </header>

  <!-- المحادثات الشخصية -->
  <div id="personal" class="chat-list">
    <div class="chat-item" onclick="alert('فتح محادثة أحمد...')">
      <div class="chat-avatar">👤</div>
      <div class="chat-details">
        <div class="chat-title">أحمد علي</div>
        <div class="chat-preview">ما هو رأيك في التصميم الجديد؟</div>
      </div>
    </div>
    <div class="chat-item" onclick="alert('فتح محادثة سارة...')">
      <div class="chat-avatar">👤</div>
      <div class="chat-details">
        <div class="chat-title">سارة محمد</div>
        <div class="chat-preview">تم إرسال المطبوعات المطلوبة 👍</div>
      </div>
    </div>
  </div>

  <!-- شات المجتمع -->
  <div id="community" class="chat-list" style="display: none;">
    <div class="chat-item" onclick="alert('الدخول إلى قروب المصممين...')">
      <div class="chat-avatar">🎨</div>
      <div class="chat-details">
        <div class="chat-title">مجتمع المصممين (الرسمي)</div>
        <div class="chat-preview">محمد: شاركونا أفضل تصاميم اليوم!</div>
      </div>
    </div>
    <div class="chat-item" onclick="alert('الدخول إلى قروب صناع المحتوى...')">
      <div class="chat-avatar">🎬</div>
      <div class="chat-details">
        <div class="chat-title">مجتمع صناع الريلز</div>
        <div class="chat-preview">علي: كيف تقومون بزيادة المشاهدات؟</div>
      </div>
    </div>
  </div>

  <!-- الدعم الفني -->
  <div id="support" class="chat-list" style="display: none;">
    <div class="chat-item" onclick="alert('فتح شات المساعدة الفنية...')">
      <div class="chat-avatar">🎧</div>
      <div class="chat-details">
        <div class="chat-title">فريق دعم SharikiHub</div>
        <div class="chat-preview">مرحباً! كيف يمكننا مساعدتك اليوم؟</div>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function switchTab(tabId) {
      // إخفاء كل القوائم
      document.getElementById('personal').style.display = 'none';
      document.getElementById('community').style.display = 'none';
      document.getElementById('support').style.display = 'none';

      // إزالة التفعيل عن الأزرار
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => tab.classList.remove('active'));

      // إظهار التبويب المحدد وتفعيل الزر
      document.getElementById(tabId).style.display = 'flex';
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
