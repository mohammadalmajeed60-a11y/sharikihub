<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* منطقة الرسائل */
    .chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 120px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-received {
      background: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }

    .msg-sent {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
      border-bottom-left-radius: 2px;
    }

    .msg-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: left;
    }

    /* شريط إدخال الرسالة */
    .input-bar {
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">💬 الدعم الفني والمحادثات</div>
  </header>

  <div class="chat-container" id="chatBox">
    <div class="message msg-received">
      مرحباً بك في SharikiHub! كيف يمكننا مساعدتك اليوم في الاستوديو أو طلباتك؟
      <div class="msg-time">10:00 ص</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">إرسال</button>
  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // إضافة رسالة المستخدم
      const userMsg = document.createElement('div');
      userMsg.className = 'message msg-sent';
      userMsg.innerText = text;
      chatBox.appendChild(userMsg);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // رد تلقائي بسيط تجريبي
      setTimeout(() => {
        const replyMsg = document.createElement('div');
        replyMsg.className = 'message msg-received';
        replyMsg.innerText = 'شكراً لتواصلك معنا! تم استلام رسالتك وسنرد عليك قريباً.';
        chatBox.appendChild(replyMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
