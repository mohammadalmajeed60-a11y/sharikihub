<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات والمجالس</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f59e0b;
    }

    .chat-tabs {
      display: flex;
      background: var(--card-bg);
      padding: 6px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* منطقة الرسائل */
    .chat-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .messages-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 130px;
    }

    .msg-card {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      border: 1px solid var(--border);
    }

    .msg-card.me {
      align-self: flex-start;
      background: var(--accent);
    }

    .msg-card.other {
      align-self: flex-end;
    }

    .msg-sender {
      font-size: 0.75rem;
      color: #fbbf24;
      margin-bottom: 2px;
      font-weight: bold;
    }

    /* قائمة المجالس الجماعية */
    .groups-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 70px;
    }

    .group-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .group-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .group-icon {
      font-size: 1.5rem;
      background: #334155;
      padding: 8px;
      border-radius: 10px;
    }

    .group-title {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .group-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* شريط الكتابة */
    .input-bar {
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 10px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      z-index: 90;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: #fff;
      outline: none;
    }

    .input-bar button {
      padding: 0 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title" id="roomTitle">💬 المحادثات العامة</div>
  </header>

  <div class="chat-tabs">
    <button class="tab-btn active" id="btnPrivate">الخاص (الأصدقاء)</button>
    <button class="tab-btn" id="btnGroups">المجالس الجماعية</button>
  </div>

  <!-- عرض المحادثات -->
  <div class="chat-view" id="chatView">
    <div class="messages-container" id="messagesBox"></div>

    <div class="input-bar" id="inputBar">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">إرسال</button>
    </div>
  </div>

  <!-- قائمة المجالس الجماعية -->
  <div class="groups-list" id="groupsList">
    <div class="group-item" onclick="joinRoom('مجلس الرياضة', 'sports')">
      <div class="group-info">
        <div class="group-icon">⚽</div>
        <div>
          <div class="group-title">مجلس الرياضة</div>
          <div class="group-sub">نقاشات المباريات والبطولات</div>
        </div>
      </div>
      <span>➡️</span>
    </div>

    <div class="group-item" onclick="joinRoom('ورشة التصميم', 'design')">
      <div class="group-info">
        <div class="group-icon">🎨</div>
        <div>
          <div class="group-title">ورشة التصميم المشترك</div>
          <div class="group-sub">أفكار المطبوعات والتيشرتات</div>
        </div>
      </div>
      <span>➡️</span>
    </div>

    <div class="group-item" onclick="joinRoom('مجلس الكتب والسينما', 'media')">
      <div class="group-info">
        <div class="group-icon">🎬</div>
        <div>
          <div class="group-title">مجلس الكتب والسينما</div>
          <div class="group-sub">ترشيحات ومناقشات الأفلام والكتب</div>
        </div>
      </div>
      <span>➡️</span>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://sharikihub-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = localStorage.getItem('sharikihub_user') || 'مستخدم_' + Math.floor(Math.random() * 1000);
    localStorage.setItem('sharikihub_user', user);

    let currentRoom = 'global';
    const messagesBox = document.getElementById('messagesBox');

    function loadRoomMessages(room) {
      messagesBox.innerHTML = '';
      db.ref('rooms/' + room).off();
      
      db.ref('rooms/' + room).on('child_added', (snapshot) => {
        const data = snapshot.val();
        const isMe = data.sender === user;
        
        const msgCard = document.createElement('div');
        msgCard.className = `msg-card ${isMe ? 'me' : 'other'}`;
        msgCard.innerHTML = `
          <div class="msg-sender">${data.sender}</div>
          <div>${data.text}</div>
        `;
        
        messagesBox.appendChild(msgCard);
        messagesBox.scrollTop = messagesBox.scrollHeight;
      });
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (text !== '') {
        db.ref('rooms/' + currentRoom).push({
          sender: user,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    const btnPrivate = document.getElementById('btnPrivate');
    const btnGroups = document.getElementById('btnGroups');
    const chatView = document.getElementById('chatView');
    const groupsList = document.getElementById('groupsList');
    const roomTitle = document.getElementById('roomTitle');

    btnPrivate.addEventListener('click', () => {
      btnPrivate.classList.add('active');
      btnGroups.classList.remove('active');
      chatView.style.display = 'flex';
      groupsList.style.display = 'none';
      roomTitle.innerText = '💬 المحادثات العامة';
      currentRoom = 'global';
      loadRoomMessages(currentRoom);
    });

    btnGroups.addEventListener('click', () => {
      btnGroups.classList.add('active');
      btnPrivate.classList.remove('active');
      chatView.style.display = 'none';
      groupsList.style.display = 'flex';
      roomTitle.innerText = '👥 اختر المجلس الجماعي';
    });

    function joinRoom(name, roomId) {
      currentRoom = roomId;
      roomTitle.innerText = '💬 ' + name;
      chatView.style.display = 'flex';
      groupsList.style.display = 'none';
      loadRoomMessages(currentRoom);
    }

    loadRoomMessages('global');
  </script>
</body>
</html>
