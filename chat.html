<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SharikiHub - المحادثات والمجتمعات</title>
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #1a2232;
      --border: #2a364f;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --purple-accent: #8b5cf6;
      --gold-gradient: linear-gradient(135deg, #ffd700, #b8860b);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    html, body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* الهيدر العلوي */
    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }

    .gold-key-btn {
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      text-decoration: none;
    }

    /* تبويبات القوائم */
    .tab-nav {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--purple-accent);
      border-bottom-color: var(--purple-accent);
      background: rgba(139, 92, 246, 0.05);
    }

    /* منطقة العرض الرئيسية */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* قائمة الأقسام */
    .sections-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 70px;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .section-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--purple-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .section-info { flex: 1; }
    .section-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 2px; }
    .section-desc { font-size: 0.75rem; color: var(--text-muted); }

    /* غرفة المحادثة النشطة */
    .chat-room {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 60px;
      display: none;
      flex-direction: column;
      background: var(--bg-main);
      z-index: 20;
    }

    .chat-header {
      padding: 10px 15px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .msg.received {
      background: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
    }

    .msg.sent {
      background: var(--accent);
      color: white;
      align-self: flex-end;
    }

    /* مربع إدخال النص المحدث للحفاظ على ظهور لوحة المفاتيح */
    .input-wrapper {
      padding: 10px 12px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: white;
      outline: none;
      font-size: 0.9rem;
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--purple-accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">💬 مجتمع SharikiHub</div>
    <a href="index.html" class="gold-key-btn">🗝️ المفتاح الذهبي</a>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('categories')">🌐 الأقسام والمجتمعات</button>
    <button class="tab-btn" onclick="switchTab('direct')">👤 المحادثات الشخصية</button>
  </div>

  <div class="content-area">
    <div class="sections-list" id="sectionsList"></div>

    <div class="chat-room" id="chatRoom">
      <div class="chat-header">
        <span id="activeRoomTitle" style="font-weight: bold; font-size: 0.9rem;"></span>
        <button class="back-btn" onclick="closeChat()">⬅️ رجوع للأقسام</button>
      </div>

      <div class="messages-box" id="messagesBox"></div>

      <div class="input-wrapper">
        <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">إرسال</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="index.html" class="nav-item">👤 حسابي</a>
  </nav>

  <script>
    const categories = [
      { id: 1, title: "قسم الأزياء والتصاميم 👕", desc: "مناقشات استوديو المطبوعات والتصاميم", icon: "🎨" },
      { id: 2, title: "قسم الرياضة والكرة ⚽", desc: "تحليلات وأخبار البطولات والمباريات", icon: "🏆" },
      { id: 3, title: "قسم الكتب والثقافة 📚", desc: "مشاركات وترشيحات الكتب والروايات", icon: "📖" },
      { id: 4, title: "قسم الأفلام والسينما 🎬", desc: "آراء ومراجعات أحدث الأفلام والمسلسلات", icon: "🍿" }
    ];

    const directChats = [
      { id: 101, title: "الدعم الفني", desc: "استفسارات الطلبات والتصميم", icon: "🛠️" },
      { id: 102, title: "مستخدم تجريبي", desc: "محادثة شخصية مباشرة", icon: "👤" }
    ];

    let currentTab = 'categories';

    function renderList() {
      const list = document.getElementById('sectionsList');
      const data = currentTab === 'categories' ? categories : directChats;
      list.innerHTML = '';

      data.forEach(item => {
        list.innerHTML += `
          <div class="section-card" onclick="openChat('${item.title}')">
            <div class="section-icon">${item.icon}</div>
            <div class="section-info">
              <div class="section-title">${item.title}</div>
              <div class="section-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      const btns = document.querySelectorAll('.tab-btn');
      btns[0].classList.toggle('active', tab === 'categories');
      btns[1].classList.toggle('active', tab === 'direct');
      closeChat();
      renderList();
    }

    function openChat(title) {
      document.getElementById('sectionsList').style.display = 'none';
      document.getElementById('chatRoom').style.display = 'flex';
      document.getElementById('activeRoomTitle').textContent = title;

      const box = document.getElementById('messagesBox');
      box.innerHTML = `<div class="msg received">مرحباً بك في ${title}! أهلاً وسهلاً. 👋</div>`;
      
      // تركيز تلقائي لفتح لوحة المفاتيح
      setTimeout(() => {
        const input = document.getElementById('msgInput');
        if(input) input.focus();
      }, 300);
    }

    function closeChat() {
      document.getElementById('sectionsList').style.display = 'flex';
      document.getElementById('chatRoom').style.display = 'none';
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const val = input.value.trim();
      if (!val) return;

      const box = document.getElementById('messagesBox');
      box.innerHTML += `<div class="msg sent">${val}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;
      input.focus(); // إبقاء التركيز على مربع الإدخال لعدم إغلاق لوحة المفاتيح
    }

    window.onload = renderList;
  </script>
</body>
</html>
