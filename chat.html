<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f59e0b;
    }

    .chat-tabs {
      display: flex;
      background: var(--card-bg);
      padding: 6px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* منطقة الرسائل والإدخال */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      padding-bottom: 60px;
    }

    .messages-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-card {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      border: 1px solid var(--border);
    }

    .msg-card.me {
      align-self: flex-start;
      background: var(--accent);
    }

    .msg-card.other {
      align-self: flex-end;
    }

    .msg-sender {
      font-size: 0.75rem;
      color: #fbbf24;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .input-bar {
      background: var(--card-bg);
      padding: 10px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: #fff;
      outline: none;
    }

    .input-bar button {
      padding: 0 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">💬 المحادثات والمجالس</div>
  </header>

  <div class="chat-tabs">
    <button class="tab-btn active">الخاص (الأصدقاء)</button>
    <button class="tab-btn">المجالس الجماعية</button>
  </div>

  <div class="chat-view">
    <div class="messages-container" id="messagesBox"></div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">إرسال</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="design-studio.html" class="nav-item">🛍️ المتجر</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://sharikihub-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = localStorage.getItem('sharikihub_user') || 'مستخدم_' + Math.floor(Math.random() * 1000);
    localStorage.setItem('sharikihub_user', user);

    const messagesBox = document.getElementById('messagesBox');

    db.ref('messages').on('child_added', (snapshot) => {
      const data = snapshot.val();
      const isMe = data.sender === user;
      
      const msgCard = document.createElement('div');
      msgCard.className = `msg-card ${isMe ? 'me' : 'other'}`;
      msgCard.innerHTML = `
        <div class="msg-sender">${data.sender}</div>
        <div>${data.text}</div>
      `;
      
      messagesBox.appendChild(msgCard);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (text !== '') {
        db.ref('messages').push({
          sender: user,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }
  </script>
</body>
</html>
