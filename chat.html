<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

    /* منطقة عرض الرسائل */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 80px;
    }

    .message-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-bubble.me {
      align-self: flex-start;
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message-bubble.other {
      align-self: flex-end;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 2px;
    }

    .sender-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    /* منطقة إدخال النص والإرسال */
    .chat-input-area {
      position: fixed;
      bottom: 60px; left: 0; right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 90;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 15px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background-color: var(--card-bg); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid var(--border); z-index: 100;
    }

    .nav-item {
      color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-item.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">💬 مجتمع SharikiHub</div>
  </header>

  <div class="chat-messages" id="chatContainer">
    <!-- الرسائل ستظهر هنا -->
  </div>

  <!-- حقل إدخال الرسالة -->
  <div class="chat-input-area">
    <input type="text" id="messageInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">🚀</button>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="explore.html" class="nav-item">🎈 الترفيه</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="admin.html" class="nav-item">👤 الملف</a>
  </nav>

  <script>
    const defaultMessages = [
      { sender: "الدعم الفني", text: "أهلاً بك في شات مجتمع SharikiHub! يمكنك التواصل ومشاركة الأفكار هنا.", type: "other" }
    ];

    function loadMessages() {
      const saved = JSON.parse(localStorage.getItem('chatMessages')) || [];
      const allMessages = [...defaultMessages, ...saved];
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';

      allMessages.forEach(msg => {
        const isMe = msg.type === 'me';
        container.innerHTML += `
          <div class="message-bubble ${isMe ? 'me' : 'other'}">
            <div class="sender-name">${msg.sender}</div>
            <div>${msg.text}</div>
          </div>
        `;
      });

      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const user = JSON.parse(localStorage.getItem('currentUser')) || { name: 'أنت' };
      const newMsg = {
        sender: user.name,
        text: text,
        type: 'me'
      };

      const saved = JSON.parse(localStorage.getItem('chatMessages')) || [];
      saved.push(newMsg);
      localStorage.setItem('chatMessages', JSON.stringify(saved));

      input.value = '';
      loadMessages();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    window.onload = loadMessages;
  </script>
</body>
</html>
