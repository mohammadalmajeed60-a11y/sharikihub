<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات الفورية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.2rem;
      color: #38bdf8;
    }

    .user-info {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent {
      align-self: flex-start;
      background-color: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.received {
      align-self: flex-end;
      background-color: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }

    .message-author {
      font-size: 0.75rem;
      margin-bottom: 4px;
      opacity: 0.8;
      font-weight: bold;
    }

    .chat-input-area {
      background: #1e293b;
      padding: 12px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #38bdf8;
    }

    .chat-input-area button {
      padding: 0 20px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-area button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <header>
    <h1>SharikiHub - غرفة الدردشة</h1>
    <div class="user-info" id="userInfo">جاري التعرف على المستخدم...</div>
  </header>

  <div class="chat-container" id="chatContainer">
    <!-- Messages will appear here -->
  </div>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">إرسال</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // تهيئة Firebase
    const firebaseConfig = {
      databaseURL: "https://sharikihub-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // معرف المستخدم الحالي
    let username = localStorage.getItem('sharikihub_user');
    if (!username) {
      username = 'زائر_' + Math.floor(Math.random() * 1000);
      localStorage.setItem('sharikihub_user', username);
    }
    document.getElementById('userInfo').innerText = 'المستخدم: ' + username;

    const chatContainer = document.getElementById('chatContainer');

    // استماع للرسائل في الوقت الفعلي
    database.ref('messages').on('child_added', (snapshot) => {
      const msg = snapshot.val();
      displayMessage(msg);
    });

    function displayMessage(msg) {
      const msgDiv = document.createElement('div');
      const isMe = msg.sender === username;
      msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;

      msgDiv.innerHTML = `
        <div class="message-author">${msg.sender}</div>
        <div>${msg.text}</div>
      `;

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (text !== '') {
        database.ref('messages').push({
          sender: username,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }
  </script>
</body>
</html>
