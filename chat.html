<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharikiHub - المحادثات</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* الشريط العلوي */
    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

    /* منطقة المحادثة */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: 60px; /* مساحة للشريط السفلي */
    }

    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message.received {
      background: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }

    .message.sent {
      background: var(--accent);
      color: white;
      align-self: flex-end;
      border-bottom-left-radius: 2px;
    }

    /* مدخل إرسال الرسالة */
    .input-box {
      padding: 10px 15px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      outline: none;
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">💬 مجتمع SharikiHub</div>
  </header>

  <div class="chat-container">
    <div class="messages-box" id="messagesBox">
      <div class="message received">أهلاً بك في غرفة المحادثة الجماعية لـ SharikiHub! 👋</div>
    </div>

    <div class="input-box">
      <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <!-- الشريط السفلي الثابت -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 الرئيسية</a>
    <a href="reels.html" class="nav-item">🎬 ريلز</a>
    <a href="chat.html" class="nav-item active">💬 المحادثات</a>
    <a href="index.html" class="nav-item">👤 حسابي</a>
  </nav>

  <script>
    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const box = document.getElementById('messagesBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message sent';
      msgDiv.textContent = text;

      box.appendChild(msgDiv);
      input.value = '';
      box.scrollTop = box.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
</html>
