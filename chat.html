<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - المحادثات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --gold-start: #ffd700;
            --gold-end: #b8860b;
        }

        body { background-color: var(--bg-main); color: var(--text); font-family: system-ui; margin: 0; padding: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--text); }

        /* ستايل المفتاح الذهبي */
        .gold-key-btn {
            background: linear-gradient(45deg, var(--gold-start), var(--gold-end));
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: transform 0.2s;
        }
        .gold-key-btn:hover { transform: scale(1.05); }

        /* منطقة الشات */
        .chat-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; height: 60vh; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 10px; background: #334155; max-width: 80%; }
        
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: white; }
        button#send-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h2>مركز المحادثات</h2>
        <!-- المفتاح الذهبي -->
        <button class="gold-key-btn" onclick="alert('جاري التوجيه لبوابة الدخول الذهبية...')">🗝️ المفتاح الذهبي</button>
    </header>

    <div class="chat-container" id="chat-box">
        <div id="messages"></div>
    </div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="اكتب رسالتك...">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <!-- ربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://sharikihub-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatBox = document.getElementById('chat-box');
        const msgContainer = document.getElementById('messages');

        // جلب الرسائل
        onValue(ref(db, 'messages'), (snapshot) => {
            msgContainer.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(m => {
                    msgContainer.innerHTML += `<div class="msg">${m.text}</div>`;
                });
            }
        });

        window.sendMessage = () => {
            const input = document.getElementById('msg-input');
            if (input.value) {
                push(ref(db, 'messages'), { text: input.value });
                input.value = '';
            }
        };
    </script>
</body>
</html>
