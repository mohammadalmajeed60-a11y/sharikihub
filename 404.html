<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharikiHub - الصفحة غير موجودة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { max-width: 450px; background: #181b2a; border-radius: 20px; padding: 40px 25px; border: 1px solid #2d3250; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .error-code { font-size: 80px; font-weight: 900; color: #ff7675; text-shadow: 0 0 20px rgba(255,118,117,0.4); margin-bottom: 10px; }
        h2 { color: #a29bfe; font-size: 22px; margin-bottom: 15px; font-weight: 900; }
        p { color: #b2bec3; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .btn-home { background: linear-gradient(135deg, #6c5ce7, #fd79a8); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; font-size: 16px; display: inline-block; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="error-code">404</div>
    <h2>عذراً! هذه الصفحة غير موجودة 🔍</h2>
    <p>يبدو أنك سلكت مساراً خاطئاً أو تم نقل الصفحة التي تبحث عنها.</p>
    <a href="index.html" class="btn-home">🏠 العودة للصفحة الرئيسية</a>
</div>

</body>
</html>
